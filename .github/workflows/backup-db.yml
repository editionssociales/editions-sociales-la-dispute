# Sauvegarde hebdomadaire, chiffrée, hors fournisseur — plan/06-operations.md,
# jalon S2, étape 6. Hebdomadaire (et non nocturne comme au plan) depuis le
# 2026-07-27 : un dump quotidien de ~44 Mo consommait ~1,3 Go/mois du quota
# de transfert Neon Free (5 Go/mois, épuisé le 26/07). Étage 2 de la chaîne
# (l'étage 1 est la restore window native Neon, 7 jours, configurée hors CI —
# elle couvre la granularité fine entre deux dumps). Dump Postgres (`pg_dump`, URL
# DIRECTE `NEON_DATABASE_URL`, jamais le pooler) → chiffré par PAIRE DE CLÉS
# age (mode passphrase non scriptable — vérifié upstream, cf. plan) → déposé
# sur le store Vercel Blob PRIVÉ dédié `es-ld-backups` (région `fra1`, lecture
# authentifiée uniquement) → purgé par rétention (`scripts/backup-prune.mjs`)
# → heartbeat Better Stack (succès uniquement).
#
# ─────────────────────────────────────────────────────────────────────────
# PROVISIONING HUMAIN REQUIS (aucun de ces éléments n'existe encore au moment
# où ce workflow est écrit — cf. plan/06-operations.md, préconditions P7/P8) :
#
#   Secrets GitHub Actions (Settings → Secrets and variables → Actions) :
#     - NEON_DATABASE_URL          URL Postgres DIRECTE/non-poolée de Neon
#                                   (`DATABASE_URL_UNPOOLED` en local) — JAMAIS
#                                   l'URL poolée (`-pooler`), pg_dump la refuse
#                                   mal et ce n'est pas le contrat de connexion
#                                   prévu pour un outil batch.
#     - BLOB_BACKUP_RW_TOKEN       Token RW du store Vercel Blob PRIVÉ dédié
#                                   `es-ld-backups` (`vercel blob create-store
#                                   es-ld-backups --access private`, région
#                                   `fra1`) — JAMAIS le token du store médias
#                                   public de la phase catalogue.
#     - BETTERSTACK_HEARTBEAT_URL  URL du heartbeat Better Stack (moniteur
#                                   "sauvegarde manquante", période 7 jours,
#                                   grace 24h — cadence hebdo, cf. cron
#                                   ci-dessous). SEUL secret OPTIONNEL : absent,
#                                   la sauvegarde tourne quand même et le
#                                   dernier step se contente d'avertir — un
#                                   backup réel non surveillé vaut mieux qu'un
#                                   backup inexistant. À poser dès que le compte
#                                   Better Stack de la structure existe (les 9
#                                   moniteurs S3 ne sont pas configurés à ce
#                                   jour, cf. OPERATIONS.md §6).
#
#   Valeur EN CLAIR à coller ci-dessous (PAS un secret — c'est la clé
#   PUBLIQUE d'une paire age, elle ne permet que de chiffrer ; la clé privée
#   — le fichier d'identité — ne doit JAMAIS transiter par la CI ni être
#   commitée) :
#     - AGE_PUBLIC_KEY              Générer hors CI : `age-keygen -o
#                                   backup-identity.txt` — remettre le fichier
#                                   d'identité à Youri ET au client (gestion-
#                                   naire de mots de passe de la structure),
#                                   coller ici la ligne `age1…` affichée par
#                                   `age-keygen` (ou `cat backup-identity.txt
#                                   | grep public`).
#
# Tant que l'un de ces éléments n'est pas posé, ce workflow échoue
# immédiatement (premier step) avec un message explicite — jamais de run
# silencieusement inopérant, jamais de dump non chiffré.
# ─────────────────────────────────────────────────────────────────────────
#
# Hors scope de ce workflow (non implémenté) : la copie additive des médias
# du store Blob public vers ce store privé. Les médias (couvertures, PDF)
# vivent désormais tous sur le store public — ils n'ont donc pas de copie
# hors Vercel à ce jour (cf. OPERATIONS.md §5).

name: Backup base de données (hebdomadaire, chiffré)

on:
  schedule:
    # Lundi 03:47 UTC — hebdomadaire (quota transfert Neon, cf. en-tête),
    # heure creuse décalée de l'heure pleine (le cron GitHub Actions n'est
    # pas garanti à la minute près aux heures rondes, cf. plan risque R5).
    - cron: "47 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Un seul run de sauvegarde à la fois ; ne jamais annuler un run en cours
  # (un dump interrompu à mi-upload est pire qu'un run en retard).
  group: backup-db
  cancel-in-progress: false

env:
  NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
  BLOB_BACKUP_RW_TOKEN: ${{ secrets.BLOB_BACKUP_RW_TOKEN }}
  BETTERSTACK_HEARTBEAT_URL: ${{ secrets.BETTERSTACK_HEARTBEAT_URL }}
  # Clé PUBLIQUE age — voir le bloc PROVISIONING ci-dessus. Posée le
  # 2026-07-26 ; le fichier d'identité correspondant (clé privée) est hors
  # dépôt et hors CI, à conserver par Youri ET le client — sans lui aucun dump
  # n'est déchiffrable.
  AGE_PUBLIC_KEY: "age1kmtyac55dxv3l7wav7sapgfl8sddw8mktm76m0mkr7jfa7jncdusjww7xj"

jobs:
  backup:
    name: pg_dump chiffré → Blob privé
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Premier step, avant tout autre travail : échoue proprement et vite
      # si le provisioning humain (secrets + clé age) n'est pas complet.
      - name: Vérifier le provisioning requis
        run: |
          missing=()
          [ -z "$NEON_DATABASE_URL" ] && missing+=("secret NEON_DATABASE_URL")
          [ -z "$BLOB_BACKUP_RW_TOKEN" ] && missing+=("secret BLOB_BACKUP_RW_TOKEN")
          case "$AGE_PUBLIC_KEY" in
            age1REPLACE_ME_*|"") missing+=("AGE_PUBLIC_KEY (placeholder non remplacé dans .github/workflows/backup-db.yml)") ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Sauvegarde annulée — provisioning manquant : ${missing[*]}. Voir l'en-tête de .github/workflows/backup-db.yml et OPERATIONS.md §5."
            exit 1
          fi
          # Le heartbeat n'est pas un prérequis : sans lui la sauvegarde est
          # réelle mais non surveillée (avertissement, jamais un échec).
          if [ -z "$BETTERSTACK_HEARTBEAT_URL" ]; then
            echo "::warning::BETTERSTACK_HEARTBEAT_URL absent — la sauvegarde va s'exécuter mais AUCUNE alerte « sauvegarde manquante » ne la surveille. À poser dès l'ouverture du compte Better Stack."
          fi
          echo "Provisioning complet, poursuite de la sauvegarde."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `@vercel/blob` (upload + purge) est déjà dans le repo (devDependency,
      # `scripts/backup-prune.mjs`) — un `pnpm install` classique suffit,
      # jamais d'install ad hoc dans ce job.
      - run: pnpm install --frozen-lockfile

      # Version majeure ALIGNÉE sur le serveur Neon (17) — un pg_dump plus
      # récent/ancien que le serveur peut être refusé (plan risque R6).
      - name: Installer postgresql-client-17 + age
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
          # L'image du runner embarque déjà un client Postgres 16 dans
          # /usr/bin, qui gagne dans le PATH et fait échouer le dump
          # (« aborting because of server version mismatch », constat live
          # 2026-07-26) : le binaire 17 vit dans /usr/lib/postgresql/17/bin,
          # on le met DEVANT et on vérifie la version majeure obtenue plutôt
          # que de la supposer.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          major="$(/usr/lib/postgresql/17/bin/pg_dump --version | grep -oE '[0-9]+' | head -1)"
          if [ "$major" != "17" ]; then
            echo "::error::pg_dump majeur $major au lieu de 17 — aligner sur la version du serveur Neon avant de dumper."
            exit 1
          fi

      - name: pg_dump (URL Neon directe/non-poolée)
        run: |
          STAMP="$(date -u +%Y%m%d)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "pg_dump utilisé : $(command -v pg_dump) — $(pg_dump --version)"
          pg_dump --format=custom --no-owner --dbname="$NEON_DATABASE_URL" \
            --file="catalogue-${STAMP}.dump"

      - name: Chiffrer par clé publique age (paire de clés, jamais de passphrase en CI)
        run: |
          age -r "$AGE_PUBLIC_KEY" -o "catalogue-${STAMP}.dump.age" "catalogue-${STAMP}.dump"
          # Le clair ne doit pas traîner plus longtemps que nécessaire, même
          # sur ce runner éphémère (défense en profondeur).
          rm -f "catalogue-${STAMP}.dump"

      # Upload direct en Node (le SDK `@vercel/blob` — pas de CLI dédiée) :
      # dépose `backups/daily/catalogue-<STAMP>.dump.age` (préfixe `daily/`
      # conservé malgré la cadence hebdo : regex de `backup-prune.mjs` et
      # blobs existants), et, au PREMIER run du mois (jour ≤ 07 en cadence
      # hebdo), une copie supplémentaire sous `backups/monthly/…` (même
      # contenu, deux clés — retenues séparément par `backup-prune.mjs`).
      # Chemins datés déterministes : acceptable ici, le store est PRIVÉ
      # (lecture authentifiée uniquement) — cf. plan risque R4.
      - name: Upload sur le store Blob privé (fra1)
        run: |
          cat > "$GITHUB_WORKSPACE/.backup-upload.mjs" <<'NODE'
          import { readFileSync } from "node:fs";
          import { put } from "@vercel/blob";

          const stamp = process.env.STAMP;
          const token = process.env.BLOB_BACKUP_RW_TOKEN;
          const file = readFileSync(`catalogue-${stamp}.dump.age`);

          async function upload(pathname) {
            await put(pathname, file, {
              access: "private",
              token,
              addRandomSuffix: false,
              allowOverwrite: true, // ré-exécution manuelle (recette) le même jour = ré-écrit, ne duplique pas
              contentType: "application/octet-stream",
            });
            console.log(`[backup] déposé : ${pathname}`);
          }

          await upload(`backups/daily/catalogue-${stamp}.dump.age`);
          if (stamp.slice(6, 8) <= "07") {
            await upload(`backups/monthly/catalogue-${stamp}.dump.age`);
          }
          NODE
          node "$GITHUB_WORKSPACE/.backup-upload.mjs"
          rm -f "$GITHUB_WORKSPACE/.backup-upload.mjs" "catalogue-${STAMP}.dump.age"

      - name: Purger la rétention (30 dumps hebdo + 12 mensuels)
        run: node scripts/backup-prune.mjs

      # Dernier step, SUCCÈS UNIQUEMENT (comportement par défaut de GitHub
      # Actions : un step précédent en échec saute celui-ci) — c'est ce qui
      # rend la promesse « une sauvegarde chaque semaine » vérifiable plutôt que
      # déclarative (plan, Recette #6). Tant que le secret n'est pas posé, le
      # step est neutralisé par son `if` (surveillance absente, sauvegarde
      # quand même effectuée).
      - name: Heartbeat Better Stack
        if: env.BETTERSTACK_HEARTBEAT_URL != ''
        run: curl -fsS "$BETTERSTACK_HEARTBEAT_URL"
