name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

# `pnpm build` n'est volontairement PAS lancé ici.
#
# Le build pré-rend 295 fiches livre, et `catalogue-http.getBook()` fait UNE requête
# REST par slug : un build à froid envoie ~300 requêtes PHP à l'hébergement OVH
# mutualisé, qui sert aussi le trafic public des WordPress. Le doubler (Actions +
# preview Vercel) à chaque PR ferait payer au client la charge de notre CI.
#
# Le build est donc vérifié par le **déploiement preview Vercel** de la PR — une
# seule fois. Voir DEVOPS.md § « Pipeline CI/CD ». Cette division tombe le jour où le
# catalogue lit PostgreSQL au lieu de WordPress (phase 3) : le build redevient
# hermétique et pourra rejoindre ce workflow.
