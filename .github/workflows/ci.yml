name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test · knip · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `incremental: true` (tsconfig) n'apporte rien sans son .tsbuildinfo :
      # on le restaure du run précédent (clé par SHA, repli sur le plus récent)
      # pour que `tsc --noEmit` ne rejoue que le delta.
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: tsbuildinfo-

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Exports morts, fichiers orphelins, dépendances inutilisées (knip.json).
      - run: pnpm knip
      - run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
